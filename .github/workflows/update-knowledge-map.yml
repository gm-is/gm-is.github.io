name: Auto Update Knowledge Map

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-knowledge-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild embedded knowledge graph
        run: python scripts/update_knowledge_graph.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet index.html data/knowledge_graph.auto.json data/knowledge_sources.auto.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/knowledge_graph.auto.json data/knowledge_sources.auto.json
          git commit -m "Auto-update knowledge map ($(date -u +%Y-%m-%d))"
          git push
