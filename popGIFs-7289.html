<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popular GIFs Dataset</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --text-sec: #94a3b8; --accent: #6366f1;
    --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
    --blue: #3b82f6; --purple: #a855f7; --cyan: #06b6d4;
    --pink: #ec4899; --orange: #f97316; --lime: #84cc16; --rose: #fb7185;
  }
  body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #loader {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; z-index: 999;
  }
  #loader h2 { font-size: 1rem; font-weight: 600; color: var(--text-sec); }
  .prog-wrap { width: 260px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-bar  { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0; }
  #loader-msg { font-size: 0.8rem; color: var(--text-sec); }
  #app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,0.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
  }
  .header-top { width: 100%; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  #app-header h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
  #count-label { font-size: 0.78rem; color: var(--text-sec); white-space: nowrap; }
  #search {
    flex: 1; min-width: 160px; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 0.82rem; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-sec); }
  .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; width: 100%; }
  .filter-label { font-size: 0.68rem; color: var(--text-sec); font-weight: 600; white-space: nowrap; }
  .filter-btn {
    padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-sec);
    font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.on { color: #fff; }
  .filter-btn[data-f="face"].on      { background:var(--green);  border-color:var(--green); }
  .filter-btn[data-f="text"].on      { background:var(--amber);  border-color:var(--amber); color:#000; }
  .filter-btn[data-f="motion"].on    { background:var(--red);    border-color:var(--red); }
  .filter-btn[data-f="sports"].on    { background:var(--blue);   border-color:var(--blue); }
  .filter-btn[data-f="politics"].on  { background:var(--purple); border-color:var(--purple); }
  .filter-btn[data-f="finance"].on   { background:var(--cyan);   border-color:var(--cyan); }
  .filter-btn[data-f="entertain"].on { background:var(--pink);   border-color:var(--pink); }
  .filter-btn[data-f="animals"].on   { background:var(--orange); border-color:var(--orange); }
  .filter-btn[data-f="positive"].on  { background:var(--lime);   border-color:var(--lime); color:#000; }
  .filter-btn[data-f="negative"].on  { background:var(--rose);   border-color:var(--rose); }
  .filter-btn[data-f="humor"].on     { background:var(--accent); border-color:var(--accent); }
  .filter-btn[data-f="cartoon"].on   { background:#8b5cf6;       border-color:#8b5cf6; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem; padding: 1.25rem 1.5rem;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.2s, transform 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-img { width: 100%; aspect-ratio: 1; background: #111318; overflow: hidden; position: relative; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,#1a1d27 25%,#22263a 50%,#1a1d27 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
  img.loaded + .shimmer { display: none; }
  .card-body { padding: 0.6rem 0.75rem; flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
  .card-id   { font-size: 0.65rem; color: var(--text-sec); font-family: monospace; }
  .card-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .tag { font-size: 0.62rem; font-weight: 700; padding: 1px 5px; border-radius: 10px; }
  .tg{background:rgba(34,197,94,.15);color:var(--green)}   .tt{background:rgba(245,158,11,.15);color:var(--amber)}
  .tm{background:rgba(239,68,68,.15);color:var(--red)}     .ts{background:rgba(59,130,246,.15);color:var(--blue)}
  .tp{background:rgba(168,85,247,.15);color:var(--purple)} .tf{background:rgba(6,182,212,.15);color:var(--cyan)}
  .te{background:rgba(236,72,153,.15);color:var(--pink)}   .ta{background:rgba(249,115,22,.15);color:var(--orange)}
  .tv{background:rgba(132,204,22,.15);color:var(--lime)}   .tn{background:rgba(251,113,133,.15);color:var(--rose)}
  .th{background:rgba(99,102,241,.15);color:var(--accent)} .tc{background:rgba(139,92,246,.15);color:#8b5cf6}
  .card-desc {
    font-size: 0.72rem; color: var(--text-sec); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer;
  }
  .card-desc.expanded { -webkit-line-clamp: unset; }
  #sentinel { height: 1px; }
  #empty { display:none; text-align:center; padding:4rem; color:var(--text-sec); }
  #empty.on { display:block; }
</style>
</head>
<body>

<div id="loader">
  <h2>Popular GIFs Dataset</h2>
  <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>
  <div id="loader-msg">Fetching data…</div>
</div>

<div id="app-header" style="display:none">
  <div class="header-top">
    <h1>Popular GIFs Dataset</h1>
    <span id="count-label"></span>
    <input id="search" type="search" placeholder="Search GIFs…">
  </div>
  <div class="filter-row">
    <span class="filter-label">VISUAL</span>
    <button class="filter-btn" data-f="face">👤 Face</button>
    <button class="filter-btn" data-f="text">🔤 Text</button>
    <button class="filter-btn" data-f="motion">🎞 Motion</button>
    <span class="filter-label" style="margin-left:.5rem">TOPIC</span>
    <button class="filter-btn" data-f="sports">🏆 Sports</button>
    <button class="filter-btn" data-f="politics">🗳 Politics</button>
    <button class="filter-btn" data-f="finance">📈 Finance</button>
    <button class="filter-btn" data-f="entertain">🎬 Entertainment</button>
    <button class="filter-btn" data-f="animals">🐾 Animals</button>
    <span class="filter-label" style="margin-left:.5rem">TONE</span>
    <button class="filter-btn" data-f="positive">😄 Positive</button>
    <button class="filter-btn" data-f="negative">😤 Negative</button>
    <button class="filter-btn" data-f="humor">😂 Humor</button>
    <button class="filter-btn" data-f="cartoon">🎨 Cartoon</button>
  </div>
</div>
<div id="grid"></div>
<div id="sentinel"></div>
<div id="empty">No GIFs match your filters.</div>

<script>
(function(){
  const BATCH=60;
  const grid=document.getElementById('grid'),sentinel=document.getElementById('sentinel'),
    emptyEl=document.getElementById('empty'),countEl=document.getElementById('count-label'),
    searchEl=document.getElementById('search'),header=document.getElementById('app-header'),
    loaderEl=document.getElementById('loader'),prog=document.getElementById('prog'),
    loaderMsg=document.getElementById('loader-msg');

  let data=[],visible=[],rendered=0,query='';
  const active={face:0,text:0,motion:0,sports:0,politics:0,finance:0,entertain:0,animals:0,positive:0,negative:0,humor:0,cartoon:0};

  const imgObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting)return;
      const img=e.target;
      if(!img.dataset.s)return;
      img.src=img.dataset.s;delete img.dataset.s;
      img.onload=()=>img.classList.add('loaded');
      imgObs.unobserve(img);
    });
  },{rootMargin:'400px'});

  const sentObs=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting)appendBatch();
  },{rootMargin:'200px'});
  sentObs.observe(sentinel);

  function makeCard(d){
    const[id,src,desc,face,text,motion,bits]=d;
    const t=[];
    if(face)   t.push('<span class="tag tg">Face</span>');
    if(text)   t.push('<span class="tag tt">Text</span>');
    if(motion) t.push('<span class="tag tm">Motion</span>');
    if(bits&1)   t.push('<span class="tag ts">Sports</span>');
    if(bits&2)   t.push('<span class="tag tp">Politics</span>');
    if(bits&4)   t.push('<span class="tag tf">Finance</span>');
    if(bits&8)   t.push('<span class="tag te">Entertainment</span>');
    if(bits&16)  t.push('<span class="tag ta">Animals</span>');
    if(bits&32)  t.push('<span class="tag tv">Positive</span>');
    if(bits&64)  t.push('<span class="tag tn">Negative</span>');
    if(bits&128) t.push('<span class="tag th">Humor</span>');
    if(bits&256) t.push('<span class="tag tc">Cartoon</span>');
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<div class="card-img"><img data-s="${src}" alt="${id}"><div class="shimmer"></div></div>
<div class="card-body"><div class="card-id">${id}</div><div class="card-tags">${t.join('')}</div><div class="card-desc">${desc.slice(0,300)}</div></div>`;
    c.querySelector('.card-desc').addEventListener('click',function(){
      this.classList.toggle('expanded');
      this.textContent=this.classList.contains('expanded')?desc:desc.slice(0,300);
    });
    imgObs.observe(c.querySelector('img'));
    return c;
  }

  function appendBatch(){
    if(rendered>=visible.length)return;
    const end=Math.min(rendered+BATCH,visible.length),frag=document.createDocumentFragment();
    for(let i=rendered;i<end;i++)frag.appendChild(makeCard(visible[i]));
    grid.appendChild(frag);rendered=end;
  }

  function render(){
    grid.innerHTML='';rendered=0;
    countEl.textContent=`${visible.length.toLocaleString()} of ${data.length.toLocaleString()} GIFs`;
    emptyEl.classList.toggle('on',visible.length===0);
    appendBatch();
  }

  function applyFilters(){
    const{face:fa,text:te,motion:mo,sports:sp,politics:po,finance:fi,entertain:en,
          animals:an,positive:pv,negative:nv,humor:hu,cartoon:ca}=active;
    const q=query;
    visible=data.filter(([id,src,desc,face,text,motion,bits])=>{
      if(fa&&!face)return false; if(te&&!text)return false; if(mo&&!motion)return false;
      if(sp&&!(bits&1))return false;  if(po&&!(bits&2))return false;
      if(fi&&!(bits&4))return false;  if(en&&!(bits&8))return false;
      if(an&&!(bits&16))return false; if(pv&&!(bits&32))return false;
      if(nv&&!(bits&64))return false; if(hu&&!(bits&128))return false;
      if(ca&&!(bits&256))return false;
      if(q&&!desc.toLowerCase().includes(q)&&!id.toLowerCase().includes(q))return false;
      return true;
    });
    render();
  }

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const k=btn.dataset.f;
      active[k]=active[k]?0:1;
      btn.classList.toggle('on',!!active[k]);
      applyFilters();
    });
  });

  let st;
  searchEl.addEventListener('input',e=>{
    clearTimeout(st);
    st=setTimeout(()=>{query=e.target.value.toLowerCase().trim();applyFilters();},300);
  });

  const xhr=new XMLHttpRequest();
  xhr.open('GET','popGIFs-data.json');
  xhr.onprogress=e=>{
    if(e.lengthComputable){
      prog.style.width=(e.loaded/e.total*85)+'%';
      loaderMsg.textContent=`Downloading… ${Math.round(e.loaded/e.total*100)}%`;
    }
  };
  xhr.onload=()=>{
    prog.style.width='95%';
    loaderMsg.textContent='Preparing…';
    setTimeout(()=>{
      data=JSON.parse(xhr.responseText);
      prog.style.width='100%';
      setTimeout(()=>{
        loaderEl.style.display='none';
        header.style.display='';
        visible=[...data];
        render();
      },150);
    },30);
  };
  xhr.onerror=()=>{loaderMsg.textContent='Failed to load. Please refresh.';};
  xhr.send();
})();
</script>
</body>
</html>
